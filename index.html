<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>家族旅遊記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7ead9; --card:#fffaf3; --ink:#4f3325; --muted:#a98a76;
    --line:#efdcc8; --field:#f8efe1;
    --brand:#b5744a; --brand2:#dba463; --brand-ink:#fff;
    --brand-grad:linear-gradient(135deg,#b5744a,#dba463);
    --cash:#6f9e55; --cash-bg:#eef4e2; --card-c:#cc7d3c; --card-bg:#fbebd3;
    --danger:#cf5f49; --danger-bg:#fbe7e1;
    --shadow:0 1px 2px rgba(120,80,50,.06),0 10px 30px rgba(120,80,50,.12);
    --shadow-sm:0 1px 2px rgba(120,80,50,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Nunito","Noto Sans TC",-apple-system,"Segoe UI",system-ui,sans-serif;
    background-color:var(--bg);color:var(--ink);line-height:1.55;-webkit-text-size-adjust:100%;
    background-image:
      radial-gradient(1100px 480px at 50% -200px,rgba(219,164,99,.3),transparent 70%),
      radial-gradient(rgba(181,116,74,.10) 2.4px, transparent 2.6px),
      radial-gradient(rgba(181,116,74,.07) 2.4px, transparent 2.6px);
    background-size:100% 100%, 26px 26px, 26px 26px;
    background-position:0 0, 0 0, 13px 13px;}
  header{position:sticky;top:0;z-index:20;background:var(--brand-grad);color:#fff;
    padding:22px 18px 24px;overflow:hidden;box-shadow:0 6px 22px rgba(150,95,55,.35);
    border-radius:0 0 26px 26px}
  header::before,header::after{content:"";position:absolute;border-radius:50%;
    background:rgba(255,255,255,.14);pointer-events:none}
  header::before{width:150px;height:150px;top:-66px;right:-26px}
  header::after{width:100px;height:100px;bottom:-54px;left:-18px;background:rgba(255,255,255,.1)}
  .head-in{max-width:640px;margin:0 auto;position:relative;z-index:1}
  header h1{margin:0;font-size:23px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  header .sub{font-size:13px;opacity:.92;margin-top:5px;font-weight:700}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 96px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:18px;margin-bottom:15px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 14px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:700}
  input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);
    border-radius:13px;font-size:15px;background:var(--field);color:var(--ink);font-family:inherit;font-weight:600;
    transition:border-color .15s,box-shadow .15s,background .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);background:#fff;
    box-shadow:0 0 0 3px rgba(181,116,74,.15)}
  textarea{resize:vertical;min-height:46px;line-height:1.5}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .btn{border:none;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:800;
    cursor:pointer;font-family:inherit;transition:transform .06s,box-shadow .15s,filter .15s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--brand-grad);color:var(--brand-ink);width:100%;
    box-shadow:0 6px 16px rgba(181,116,74,.32)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:#eef0fa;color:var(--ink)}
  .btn.ghost:hover{background:#e6e8f6}
  .btn.sm{padding:8px 11px;font-size:13px;font-weight:700}
  .seg{display:flex;gap:10px}
  .seg button{flex:1;padding:12px;border-radius:13px;border:1.5px solid var(--line);
    background:var(--field);font-size:14.5px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;
    transition:.12s}
  .seg button.on[data-m="cash"]{border-color:var(--cash);background:var(--cash-bg);color:var(--cash);box-shadow:0 3px 10px rgba(14,163,113,.18)}
  .seg button.on[data-m="card"]{border-color:var(--card-c);background:var(--card-bg);color:var(--card-c);box-shadow:0 3px 10px rgba(224,122,31,.18)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);
    font-size:14px;cursor:pointer;user-select:none;color:var(--muted);font-weight:700;transition:.12s}
  .chip.on{background:var(--brand-grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(181,116,74,.3)}
  .members-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .mtag{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 5px;font-size:14px;font-weight:700;
    display:flex;align-items:center;gap:7px}
  .mtag button{border:none;background:#e3e3ef;color:#777795;border-radius:999px;width:20px;height:20px;
    cursor:pointer;font-size:14px;line-height:1;padding:0;transition:.12s}
  .mtag button:hover{background:var(--danger-bg);color:var(--danger)}
  .ava{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    color:#fff;font-weight:800;font-size:12.5px;flex:0 0 auto;font-family:"Nunito","Noto Sans TC",sans-serif;
    box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .ava.sm{width:21px;height:21px;font-size:11px}
  .exp{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;background:#fff;
    box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .exp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .exp.m-cash::before{background:var(--cash)}
  .exp.m-card::before{background:var(--card-c)}
  .exp .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .exp .title{font-weight:800;font-size:15.5px}
  .exp .amt{font-weight:900;font-size:18px;white-space:nowrap}
  .exp .meta{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}
  .tag{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px}
  .tag.cash{background:var(--cash-bg);color:var(--cash)}
  .tag.card{background:var(--card-bg);color:var(--card-c)}
  .exp .note{font-size:13px;color:#5a5a74;margin-top:8px;white-space:pre-wrap;background:var(--field);
    padding:7px 10px;border-radius:10px}
  .exp .foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;
    border-top:1px dashed var(--line);padding-top:10px}
  .exp .split{font-size:12px;color:var(--muted);font-weight:600}
  .linkbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
    padding:4px 8px;border-radius:8px;font-family:inherit;font-weight:700;transition:.12s}
  .linkbtn:hover{background:var(--field);color:var(--brand)}
  .linkbtn.del:hover{background:var(--danger-bg);color:var(--danger)}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:24px 8px;font-weight:600}
  .stat{display:flex;gap:10px;margin-bottom:14px}
  .stat .box{flex:1;background:linear-gradient(160deg,#f7f7fc,#eef0fa);border:1px solid var(--line);
    border-radius:15px;padding:12px}
  .stat .box:first-child{background:var(--brand-grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(181,116,74,.28)}
  .stat .box:first-child .k{color:rgba(255,255,255,.85)}
  .stat .k{font-size:11.5px;color:var(--muted);font-weight:700}
  .stat .v{font-size:19px;font-weight:900;margin-top:3px;letter-spacing:.3px}
  .subsec{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-top:13px}
  .subsec:first-of-type{margin-top:4px}
  .subhead{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .bal{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .bal:last-child{border-bottom:none}
  .bal .who{display:flex;align-items:center;gap:9px;font-weight:700}
  .pos{color:var(--cash);font-weight:800}.neg{color:var(--danger);font-weight:800}
  .flat{color:var(--muted);font-weight:700}
  .settle{display:flex;align-items:center;gap:9px;padding:12px;background:#fff;
    border:1px solid var(--line);border-radius:14px;margin-bottom:9px;font-size:14.5px;box-shadow:var(--shadow-sm)}
  .settle:last-child{margin-bottom:0}
  .rate-grid{display:flex;flex-wrap:wrap;gap:7px}
  .rate-pill{background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px 10px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-sm)}
  .rate-pill b{font-weight:900;color:var(--brand)}
  .rate-when{font-size:11.5px;color:var(--muted);margin-top:9px;font-weight:600}
  .rate-when.off{color:var(--danger)}
  .settle .from,.settle .to{font-weight:800;display:flex;align-items:center;gap:7px}
  .settle .arrow{color:var(--brand);font-weight:900;font-size:16px}
  .settle .m{margin-left:auto;font-weight:900;color:var(--ink)}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600;line-height:1.6;
    background:var(--field);padding:11px 13px;border-radius:12px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#4f3325;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 動畫效果 ---------- */
  @keyframes wiggle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}
  @keyframes bounceIn{0%{transform:scale(.6)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes pulse{0%,100%{box-shadow:0 6px 16px rgba(181,116,74,.32)}50%{box-shadow:0 6px 26px rgba(219,164,99,.6)}}
  @keyframes popTag{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

  .bear{display:inline-block;transform-origin:65% 75%;animation:wiggle 2.4s ease-in-out infinite}
  header::before{animation:floaty 6s ease-in-out infinite}
  header::after{animation:floaty 7s ease-in-out infinite .5s}

  .card{animation:popIn .5s cubic-bezier(.22,1,.36,1) both}
  .card:nth-of-type(1){animation-delay:.02s}
  .card:nth-of-type(2){animation-delay:.09s}
  .card:nth-of-type(3){animation-delay:.16s}
  .card:nth-of-type(4){animation-delay:.23s}
  .card:nth-of-type(5){animation-delay:.3s}

  .btn{will-change:transform}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.95)}
  .btn.primary{animation:pulse 2.6s ease-in-out infinite}
  .btn.primary:hover{transform:translateY(-2px) scale(1.01)}

  .chip{transition:transform .12s,background .15s,color .15s,border-color .15s,box-shadow .15s}
  .chip:active{transform:scale(.9)}
  .chip.on{animation:bounceIn .32s cubic-bezier(.22,1.5,.5,1)}
  .seg button:active{transform:scale(.96)}
  .seg button.on{animation:bounceIn .3s cubic-bezier(.22,1.5,.5,1)}

  .ava{transition:transform .2s cubic-bezier(.22,1.5,.5,1)}
  .ava:hover{transform:scale(1.2) rotate(-8deg)}
  .mtag{animation:popTag .3s ease both;transition:transform .15s}
  .mtag:hover{transform:translateY(-2px) rotate(-1.5deg)}

  .exp{transition:transform .18s,box-shadow .18s;animation:popIn .4s ease both}
  .exp:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(120,80,50,.16)}
  .settle{transition:transform .18s,box-shadow .18s}
  .settle:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 8px 20px rgba(120,80,50,.16)}
  .rate-pill{transition:transform .15s}
  .rate-pill:hover{transform:translateY(-2px) rotate(-1deg)}
  .stat .box{transition:transform .18s}
  .stat .box:hover{transform:translateY(-3px)}
  .linkbtn{transition:background .12s,color .12s,transform .12s}
  .linkbtn:active{transform:scale(.9)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important}
    .card,.exp{opacity:1 !important;transform:none !important}
  }
</style>

<header>
  <div class="head-in">
    <h1><span class="bear">🧸</span> 家族旅遊記帳</h1>
    <div class="sub">🐾 刷卡／現金 · 多幣別即時匯率 · 自動分帳結算</div>
  </div>
</header>

<div class="wrap">

  <!-- 團員 -->
  <div class="card">
    <h2>🧸 團員</h2>
    <div class="members-tags" id="memberTags"></div>
    <div class="row">
      <input id="memberName" placeholder="輸入名字，例如：爸爸" maxlength="12"
             onkeydown="if(event.key==='Enter')addMember()">
      <button class="btn ghost" style="flex:0 0 auto" onclick="addMember()">＋ 新增</button>
    </div>
  </div>

  <!-- 記一筆 -->
  <div class="card">
    <h2>🍯 記一筆支出</h2>
    <div style="margin-bottom:12px">
      <label>項目名稱</label>
      <input id="expTitle" placeholder="例如：晚餐、住宿、租車" maxlength="30">
    </div>
    <div class="row" style="margin-bottom:12px">
      <div style="flex:1.5">
        <label>金額</label>
        <input id="expAmount" type="number" inputmode="decimal" min="0" step="1" placeholder="0">
      </div>
      <div style="flex:1">
        <label>幣別</label>
        <select id="expCurrency"></select>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <label>誰付的錢</label>
      <select id="expPayer"></select>
    </div>
    <div style="margin-bottom:12px">
      <label>付款方式</label>
      <div class="seg" id="payMethod">
        <button type="button" data-m="cash" class="on" onclick="setMethod('cash')">💵 現金</button>
        <button type="button" data-m="card" onclick="setMethod('card')">💳 刷卡</button>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <label>備註（可留空）</label>
      <textarea id="expNote" placeholder="例如：含小費、幫小孩多點一份"></textarea>
    </div>
    <div style="margin-bottom:14px">
      <label style="display:flex;justify-content:space-between">
        <span>分帳給誰（平均分攤）</span>
        <span><button class="linkbtn" onclick="toggleAllSplit()">全選／全不選</button></span>
      </label>
      <div class="chips" id="splitChips"></div>
    </div>
    <button class="btn primary" id="submitBtn" onclick="saveExpense()">✓ 新增這筆帳</button>
  </div>

  <!-- 帳目 -->
  <div class="card">
    <h2>📒 帳目明細 <span id="expCount" style="color:var(--muted);font-weight:600;font-size:13px"></span></h2>
    <div class="stat">
      <div class="box"><div class="k">總支出<span style="font-weight:500">(約台幣)</span></div><div class="v" id="totalAll">0</div></div>
      <div class="box"><div class="k">💵 現金</div><div class="v" id="totalCash">0</div></div>
      <div class="box"><div class="k">💳 刷卡</div><div class="v" id="totalCard">0</div></div>
    </div>
    <div id="expList"></div>
  </div>

  <!-- 結算 -->
  <div class="card">
    <h2>🧮 結算 <span style="font-weight:600;color:var(--muted);font-size:13px">（全部換算台幣）</span></h2>
    <div class="subsec">
      <div class="subhead" style="justify-content:space-between">
        <span>💱 即時匯率</span>
        <button class="btn ghost sm" style="flex:0 0 auto;padding:4px 10px" onclick="refreshRates(true)">🔄 更新</button>
      </div>
      <div id="rateInfo"></div>
    </div>
    <div class="subsec">
      <div class="subhead">💰 每人收支結餘 <span style="font-weight:600;color:#9aa4b5">（台幣）</span></div>
      <div id="balances"></div>
    </div>
    <div class="subsec">
      <div class="subhead">🔁 建議轉帳 <span style="font-weight:600;color:#9aa4b5">（台幣・最少轉帳次數）</span></div>
      <div id="settlements"></div>
    </div>
  </div>

  <!-- 工具 -->
  <div class="card">
    <h2>💾 資料備份</h2>
    <div class="row" style="margin-bottom:8px">
      <button class="btn primary sm" onclick="exportBackup()">💾 存檔備份</button>
      <button class="btn ghost sm" onclick="document.getElementById('importFile').click()">📂 讀取備份</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importBackup(event)">
    <div class="row">
      <button class="btn ghost sm" onclick="exportCSV()">⬇ 匯出 CSV（給 Excel）</button>
      <button class="btn ghost sm" onclick="clearAllExpenses()" style="color:var(--danger)">🗑 清空帳目</button>
    </div>
    <div class="hint">🔒 <b>怕資料不見，就按「存檔備份」</b>：會下載一個備份檔，建議存到雲端硬碟（Google Drive／iCloud）或傳給自己。日後在任何裝置按「讀取備份」即可完整還原。平常資料只存在本機瀏覽器，清除瀏覽器資料就會消失，請定期存檔。</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- 幣別設定 ---------- */
const CURRENCIES = {
  TWD:{name:"台幣",   symbol:"NT$", flag:"🇹🇼", dec:0},
  USD:{name:"美金",   symbol:"US$", flag:"🇺🇸", dec:2},
  EUR:{name:"歐元",   symbol:"€",   flag:"🇪🇺", dec:2},
  CNY:{name:"人民幣", symbol:"¥",   flag:"🇨🇳", dec:2},
  VND:{name:"越南盾", symbol:"₫",   flag:"🇻🇳", dec:0},
};
// 內建預設匯率（每 1 單位外幣 = 幾元台幣），連不上網路時的後備值
const FALLBACK_RATES = { TWD:1, USD:32, EUR:35, CNY:4.5, VND:0.00127 };

let state = { members: [], expenses: [], method:"cash", split:{}, editing:null,
  lastCurrency:"TWD", rates:{...FALLBACK_RATES}, ratesAt:null, ratesLive:false };

/* ---------- 儲存 ---------- */
function load(){
  try{
    const s = JSON.parse(localStorage.getItem("familyTrip")||"{}");
    state.members = s.members||[];
    state.expenses = s.expenses||[];
    if(s.lastCurrency) state.lastCurrency = s.lastCurrency;
  }catch(e){}
  try{
    const r = JSON.parse(localStorage.getItem("familyTripRates")||"{}");
    if(r.rates){ state.rates = r.rates; state.ratesAt = r.at||null; }
  }catch(e){}
  if(state.members.length===0) state.members = ["爸爸","媽媽"];
}
function save(){
  localStorage.setItem("familyTrip", JSON.stringify(
    {members:state.members, expenses:state.expenses, lastCurrency:state.lastCurrency}));
}

/* ---------- 匯率 ---------- */
function rateOf(cur){ return state.rates[cur] || FALLBACK_RATES[cur] || 1; }
function toTWD(amount, cur){ return amount * rateOf(cur||"TWD"); }
async function refreshRates(manual){
  try{
    const res = await fetch("https://open.er-api.com/v6/latest/TWD");
    if(!res.ok) throw new Error("net");
    const data = await res.json();
    if(!data || !data.rates) throw new Error("bad");
    const r = {TWD:1};
    ["USD","EUR","CNY","VND"].forEach(c=>{ if(data.rates[c]) r[c] = 1/data.rates[c]; });
    state.rates = r; state.ratesAt = Date.now(); state.ratesLive = true;
    localStorage.setItem("familyTripRates", JSON.stringify({rates:r, at:state.ratesAt}));
    if(manual) toast("匯率已更新");
  }catch(e){
    state.ratesLive = false;
    if(manual) toast("連不上匯率，暫用現有匯率");
  }
  renderAll();
}

/* ---------- 工具 ---------- */
function curFmt(amount, cur){
  const c = CURRENCIES[cur] || CURRENCIES.TWD;
  return c.symbol + Number(amount).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:c.dec});
}
function twd(n){ return "NT$" + Math.round(n).toLocaleString(); }
function uid(){ return "e"+Math.floor(performance.now()*1000)+Math.floor((performance.now()%1)*1e6); }
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800);
}

/* ---------- 團員 ---------- */
function addMember(){
  const inp=document.getElementById("memberName"); const name=inp.value.trim();
  if(!name){ return; }
  if(state.members.includes(name)){ toast("已經有這個團員了"); return; }
  state.members.push(name); inp.value=""; save(); renderMembers(); renderForm();
}
function removeMember(name){
  const used = state.expenses.some(e=> e.payer===name || e.split.includes(name));
  if(used && !confirm(`「${name}」已經在某些帳目裡，刪除後那些帳目仍保留該名字。確定刪除團員？`)) return;
  state.members = state.members.filter(m=>m!==name);
  delete state.split[name];
  save(); renderMembers(); renderForm(); renderAll();
}
function renderMembers(){
  const el=document.getElementById("memberTags");
  el.innerHTML = state.members.length? state.members.map(m=>
    `<span class="mtag">${ava(m,true)}${esc(m)}<button onclick="removeMember('${escq(m)}')" title="刪除">×</button></span>`
  ).join("") : `<span class="empty" style="padding:4px">還沒有團員，先新增吧</span>`;
}

/* ---------- 記帳表單 ---------- */
function setMethod(m){
  state.method=m;
  document.querySelectorAll("#payMethod button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
}
function toggleSplit(name){
  state.split[name]=!state.split[name]; renderSplitChips();
}
function toggleAllSplit(){
  const allOn = state.members.every(m=>state.split[m]);
  state.members.forEach(m=> state.split[m]=!allOn); renderSplitChips();
}
function renderForm(){
  const sel=document.getElementById("expPayer");
  const cur=sel.value;
  sel.innerHTML = state.members.map(m=>`<option>${esc(m)}</option>`).join("");
  if(state.members.includes(cur)) sel.value=cur;
  // 幣別下拉（只建一次）
  const csel=document.getElementById("expCurrency");
  if(csel && !csel.dataset.built){
    csel.innerHTML = Object.keys(CURRENCIES).map(k=>
      `<option value="${k}">${CURRENCIES[k].flag} ${CURRENCIES[k].name} ${k}</option>`).join("");
    csel.dataset.built="1";
    csel.value = state.lastCurrency||"TWD";
  }
  // 預設全部參與分帳
  state.members.forEach(m=>{ if(!(m in state.split)) state.split[m]=true; });
  Object.keys(state.split).forEach(m=>{ if(!state.members.includes(m)) delete state.split[m]; });
  renderSplitChips();
}
function renderSplitChips(){
  const el=document.getElementById("splitChips");
  el.innerHTML = state.members.map(m=>
    `<span class="chip ${state.split[m]?'on':''}" onclick="toggleSplit('${escq(m)}')">${esc(m)}</span>`
  ).join("") || `<span class="empty" style="padding:4px">先新增團員</span>`;
}
function saveExpense(){
  const title=document.getElementById("expTitle").value.trim() || "未命名支出";
  const amount=parseFloat(document.getElementById("expAmount").value);
  const currency=document.getElementById("expCurrency").value||"TWD";
  const payer=document.getElementById("expPayer").value;
  const note=document.getElementById("expNote").value.trim();
  const split=state.members.filter(m=>state.split[m]);
  if(!amount || amount<=0){ toast("請輸入正確金額"); return; }
  if(!payer){ toast("請先新增團員並選擇付款人"); return; }
  if(split.length===0){ toast("至少要勾選一位分帳對象"); return; }

  state.lastCurrency=currency;
  if(state.editing){
    const e=state.expenses.find(x=>x.id===state.editing);
    Object.assign(e,{title,amount,currency,payer,method:state.method,note,split});
    state.editing=null; document.getElementById("submitBtn").textContent="✓ 新增這筆帳";
    toast("已更新");
  }else{
    state.expenses.unshift({id:uid(),title,amount,currency,payer,method:state.method,note,split,ts:Date.now()});
    toast("已記一筆 "+curFmt(amount,currency));
  }
  save();
  document.getElementById("expTitle").value="";
  document.getElementById("expAmount").value="";
  document.getElementById("expNote").value="";
  renderAll();
  window.scrollTo({top:document.querySelector(".wrap").offsetTop, behavior:"smooth"});
}
function editExpense(id){
  const e=state.expenses.find(x=>x.id===id); if(!e) return;
  document.getElementById("expTitle").value=e.title;
  document.getElementById("expAmount").value=e.amount;
  renderForm();
  document.getElementById("expCurrency").value=e.currency||"TWD";
  document.getElementById("expPayer").value=e.payer;
  document.getElementById("expNote").value=e.note||"";
  setMethod(e.method);
  state.members.forEach(m=> state.split[m]=e.split.includes(m));
  renderSplitChips();
  state.editing=id; document.getElementById("submitBtn").textContent="✓ 儲存修改";
  window.scrollTo({top:0,behavior:"smooth"}); toast("編輯中…修改後按儲存");
}
function deleteExpense(id){
  if(!confirm("確定刪除這筆帳？")) return;
  state.expenses=state.expenses.filter(x=>x.id!==id);
  if(state.editing===id){state.editing=null;document.getElementById("submitBtn").textContent="✓ 新增這筆帳";}
  save(); renderAll();
}

/* ---------- 明細 ---------- */
function renderExpenses(){
  const el=document.getElementById("expList");
  document.getElementById("expCount").textContent = state.expenses.length? `共 ${state.expenses.length} 筆` : "";
  if(state.expenses.length===0){ el.innerHTML=`<div class="empty">還沒有任何帳目，上面記一筆吧 🙂</div>`; return; }
  el.innerHTML = state.expenses.map(e=>{
    const cur = e.currency||"TWD";
    const per = e.amount/e.split.length;
    const d = new Date(e.ts);
    const date = `${d.getMonth()+1}/${d.getDate()}`;
    const isTWD = cur==="TWD";
    const twdEq = isTWD ? "" : `<div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-top:1px">≈ ${twd(toTWD(e.amount,cur))}</div>`;
    return `<div class="exp m-${e.method}">
      <div class="top">
        <div>
          <div class="title">${esc(e.title)}</div>
          <div class="meta">
            <span class="tag ${e.method}">${e.method==='cash'?'💵 現金':'💳 刷卡'}</span>
            <span>${CURRENCIES[cur]?CURRENCIES[cur].flag:''} ${cur}</span><span>·</span>
            <span style="display:inline-flex;align-items:center;gap:4px">${ava(e.payer,true)}${esc(e.payer)} 付</span><span>·</span><span>${date}</span>
          </div>
        </div>
        <div style="text-align:right"><div class="amt">${curFmt(e.amount,cur)}</div>${twdEq}</div>
      </div>
      ${e.note?`<div class="note">📝 ${esc(e.note)}</div>`:""}
      <div class="foot">
        <div class="split">分 ${e.split.length} 人 · 每人 ${curFmt(per,cur)}<br><span style="color:#9aa4b5">${e.split.map(esc).join("、")}</span></div>
        <div>
          <button class="linkbtn" onclick="editExpense('${e.id}')">編輯</button>
          <button class="linkbtn del" onclick="deleteExpense('${e.id}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join("");
  const total=state.expenses.reduce((s,e)=>s+toTWD(e.amount,e.currency||"TWD"),0);
  const cash=state.expenses.filter(e=>e.method==='cash').reduce((s,e)=>s+toTWD(e.amount,e.currency||"TWD"),0);
  document.getElementById("totalAll").textContent=twd(total);
  document.getElementById("totalCash").textContent=twd(cash);
  document.getElementById("totalCard").textContent=twd(total-cash);
}

/* ---------- 結算 ---------- */
function computeBalances(){
  // 全部換算成台幣後再計算
  const bal={}; state.members.forEach(m=>bal[m]=0);
  state.expenses.forEach(e=>{
    const amt=toTWD(e.amount, e.currency||"TWD");
    if(!(e.payer in bal)) bal[e.payer]=0;
    bal[e.payer]+=amt;                      // 付錢 => 正
    const per=amt/e.split.length;
    e.split.forEach(m=>{ if(!(m in bal)) bal[m]=0; bal[m]-=per; }); // 該分攤 => 負
  });
  return bal;
}
function renderRateInfo(){
  const el=document.getElementById("rateInfo"); if(!el) return;
  const rateStr=c=>{ const r=rateOf(c); return "NT$"+(r>=1? r.toFixed(2) : r.toPrecision(2)); };
  const pills = ["USD","EUR","CNY","VND"].map(c=>
    `<span class="rate-pill">${CURRENCIES[c].flag} 1 ${c} <b>≈ ${rateStr(c)}</b></span>`).join("");
  let when;
  if(!state.ratesAt){
    when=`<span class="off">尚未取得即時匯率，使用內建預設值。按「🔄 更新」抓取最新匯率。</span>`;
  }else{
    const t=new Date(state.ratesAt).toLocaleString();
    when=`${state.ratesLive?"✅ 即時匯率":"⚠️ 目前離線，沿用上次匯率"}　更新於 ${t}`;
  }
  el.innerHTML=`<div class="rate-grid">${pills}</div><div class="rate-when ${state.ratesAt?'':'off'}">${when}</div>`;
}
function renderSettlement(){
  renderRateInfo();
  const balEl=document.getElementById("balances");
  const setEl=document.getElementById("settlements");
  if(state.expenses.length===0){
    balEl.innerHTML=`<div class="empty" style="padding:8px">有帳目後會顯示每人收支</div>`;
    setEl.innerHTML=`<div class="empty" style="padding:8px">有帳目後會給出還款建議</div>`; return;
  }
  const bal=computeBalances();
  balEl.innerHTML = Object.keys(bal).map(m=>{
    const v=bal[m]; const cls=v>0.5?"pos":(v<-0.5?"neg":"flat");
    const txt=v>0.5?`應收回 ${twd(v)}`:(v<-0.5?`要付出 ${twd(-v)}`:"打平 ✓");
    return `<div class="bal"><span class="who">${ava(m,true)}${esc(m)}</span><span class="${cls}">${txt}</span></div>`;
  }).join("");

  // 貪婪最少轉帳
  const debtors=[], creditors=[];
  Object.keys(bal).forEach(m=>{
    const v=Math.round(bal[m]*100)/100;
    if(v<-0.5) debtors.push({m,v:-v}); else if(v>0.5) creditors.push({m,v});
  });
  debtors.sort((a,b)=>b.v-a.v); creditors.sort((a,b)=>b.v-a.v);
  const tx=[]; let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const pay=Math.min(debtors[i].v, creditors[j].v);
    tx.push({from:debtors[i].m, to:creditors[j].m, amt:pay});
    debtors[i].v-=pay; creditors[j].v-=pay;
    if(debtors[i].v<0.5) i++; if(creditors[j].v<0.5) j++;
  }
  setEl.innerHTML = tx.length? tx.map(t=>
    `<div class="settle"><span class="from">${ava(t.from,true)}${esc(t.from)}</span>
      <span class="arrow">→</span><span class="to">${ava(t.to,true)}${esc(t.to)}</span>
      <span class="m">${twd(t.amt)}</span></div>`
  ).join("") : `<div class="empty">大家剛好打平，不用轉帳 🎉</div>`;
}

/* ---------- 匯出 / 清空 ---------- */
function exportCSV(){
  if(state.expenses.length===0){ toast("沒有資料可匯出"); return; }
  const rows=[["日期","項目","金額","幣別","約合台幣","付款方式","付款人","分帳人數","每人(原幣)","分帳對象","備註"]];
  state.expenses.slice().reverse().forEach(e=>{
    const d=new Date(e.ts); const cur=e.currency||"TWD";
    rows.push([`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`, e.title, e.amount, cur,
      Math.round(toTWD(e.amount,cur)),
      e.method==='cash'?'現金':'刷卡', e.payer, e.split.length,
      Math.round(e.amount/e.split.length*100)/100, e.split.join("、"), (e.note||"").replace(/\n/g," ")]);
  });
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="家族旅遊記帳.csv"; a.click();
  toast("已匯出 CSV");
}
function clearAllExpenses(){
  if(!confirm("確定清空所有帳目？團員會保留。此動作無法復原。")) return;
  state.expenses=[]; state.editing=null;
  document.getElementById("submitBtn").textContent="✓ 新增這筆帳";
  save(); renderAll(); toast("已清空帳目");
}
function pad2(n){ return String(n).padStart(2,"0"); }
function exportBackup(){
  const data={app:"family-trip-expense",version:1,savedAt:new Date().toISOString(),
    members:state.members, expenses:state.expenses};
  const d=new Date();
  const stamp=`${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download=`家族旅遊記帳_備份_${stamp}.json`; a.click();
  toast("已下載備份檔");
}
function importBackup(ev){
  const file=ev.target.files[0]; if(!file){ return; }
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.members) || !Array.isArray(data.expenses))
        throw new Error("缺少 members 或 expenses 欄位");
      const ok=confirm(`確定讀取此備份？將【覆蓋】目前所有資料。\n\n備份內容：${data.members.length} 位團員、${data.expenses.length} 筆帳目${data.savedAt?`\n備份時間：${new Date(data.savedAt).toLocaleString()}`:""}`);
      if(!ok){ ev.target.value=""; return; }
      state.members=data.members.map(String);
      state.expenses=data.expenses;
      state.editing=null; state.split={};
      document.getElementById("submitBtn").textContent="✓ 新增這筆帳";
      save(); renderMembers(); renderForm(); renderAll();
      toast(`已還原 ${data.expenses.length} 筆帳目`);
    }catch(err){
      alert("讀取失敗：這不是有效的備份檔。\n\n"+(err.message||err));
    }
    ev.target.value=""; // 重設，讓同一個檔可再次選取
  };
  reader.readAsText(file);
}

/* ---------- 共用 ---------- */
const AVA_COLORS=["#b5744a","#cc7d3c","#a0632e","#d79a5b","#8a5a3b","#c58a5a","#9c7b4f","#6f9e55","#c67b6b","#7a5230"];
function avaColor(name){ let h=0; for(const c of String(name)) h=(h*31+c.codePointAt(0))>>>0; return AVA_COLORS[h%AVA_COLORS.length]; }
function ava(name,sm){ const ch=[...String(name)][0]||"?";
  return `<span class="ava${sm?' sm':''}" style="background:${avaColor(name)}">${esc(ch)}</span>`; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escq(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function renderAll(){ renderExpenses(); renderSettlement(); }

load(); renderMembers(); renderForm(); renderAll();
refreshRates(false); // 開啟時抓即時匯率（失敗則用上次或內建值）
</script>
